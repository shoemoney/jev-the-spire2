<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#05070f}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;
    background:
      radial-gradient(900px 620px at 78% 52%, rgba(37,130,255,.38), transparent 62%),
      radial-gradient(700px 520px at 18% 78%, rgba(120,40,220,.34), transparent 64%),
      linear-gradient(175deg,#0a1024 0%,#070a16 45%,#04060d 100%);
  }
  /* the spire: stacked receding slabs behind everything */
  .spire{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:520px;height:820px;
    background:linear-gradient(180deg,rgba(90,120,200,.20),rgba(20,30,60,0) 70%);
    clip-path:polygon(38% 0,62% 0,78% 100%,22% 100%);filter:blur(1px)}
  .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:620px;height:620px;border-radius:50%;
    border:2px solid rgba(90,170,255,.30);box-shadow:0 0 90px rgba(40,140,255,.35) inset}
  .ring.two{width:780px;height:780px;border-color:rgba(90,170,255,.14)}
  .grid{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(120,180,255,.5) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,180,255,.5) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(700px 420px at 60% 60%,#000,transparent 75%)}
  /* floating cards */
  .card{position:absolute;width:104px;height:146px;border-radius:10px;
    background:linear-gradient(160deg,#1b2b52,#0b1430);
    border:2px solid rgba(120,190,255,.75);
    box-shadow:0 0 28px rgba(60,150,255,.65),inset 0 0 22px rgba(30,90,190,.55)}
  .card::after{content:'';position:absolute;inset:11px;border-radius:5px;
    border:1px solid rgba(150,210,255,.45)}
  .robot{position:absolute;right:-30px;bottom:-56px;height:800px;
    filter:drop-shadow(0 0 46px rgba(60,150,255,.75)) drop-shadow(0 26px 40px rgba(0,0,0,.85))}
  .copy{position:absolute;left:58px;top:92px;width:690px;z-index:5}
  .kicker{font-family:Inter,sans-serif;font-weight:900;font-size:30px;letter-spacing:.16em;
    color:#57c8ff;text-transform:uppercase;text-shadow:0 0 22px rgba(60,180,255,.85);margin-bottom:12px}
  h1{font-family:'Archivo Black',Inter,sans-serif;font-size:104px;line-height:.9;color:#fff;
    text-transform:uppercase;letter-spacing:-.022em;
    text-shadow:0 0 42px rgba(40,130,255,.62),0 8px 24px rgba(0,0,0,.92)}
  h1 .hl{color:#ffd23f;text-shadow:0 0 42px rgba(255,190,50,.85),0 8px 24px rgba(0,0,0,.9)}
  .stats{display:flex;gap:16px;margin-top:30px}
  .stat{background:rgba(6,12,28,.90);border:2px solid rgba(90,180,255,.62);border-radius:14px;
    padding:13px 20px;box-shadow:0 0 28px rgba(40,130,255,.32)}
  .stat b{display:block;font-family:'Archivo Black',sans-serif;font-size:36px;color:#57ff9e;line-height:1}
  .stat span{font-family:Inter,sans-serif;font-weight:700;font-size:14px;letter-spacing:.11em;
    color:#9fc2e8;text-transform:uppercase}
  .logo{position:absolute;left:58px;bottom:44px;height:74px;
    filter:drop-shadow(0 0 22px rgba(40,140,255,.85));z-index:6}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
    width:186px;height:186px;border-radius:50%;
    background:rgba(8,14,30,.74);border:6px solid #fff;
    box-shadow:0 0 70px rgba(0,0,0,.85),0 0 60px rgba(60,160,255,.6);
    display:none;align-items:center;justify-content:center}
  .play::after{content:'';margin-left:14px;border-style:solid;
    border-width:44px 0 44px 72px;border-color:transparent transparent transparent #fff}
  body.withplay .play{display:flex}
  body.withplay .stage::before{content:'';position:absolute;inset:0;z-index:15;background:rgba(2,5,14,.34)}
</style></head>
<body>
<div class="stage">
  <div class="spire"></div><div class="ring two"></div><div class="ring"></div><div class="grid"></div>
  <div class="card" style="left:812px;top:84px;transform:rotate(-17deg)"></div>
  <div class="card" style="left:938px;top:44px;transform:rotate(-5deg)"></div>
  <div class="card" style="left:1064px;top:96px;transform:rotate(11deg)"></div>
  <div class="card" style="left:742px;top:238px;transform:rotate(-26deg);opacity:.75"></div>
  <img class="robot" src="robot.png" alt="">
  <div class="copy">
    <div class="kicker">I built a robot to play</div>
    <h1>SLAY THE<br>SPIRE <span class="hl">2</span></h1>
    <div class="stats">
      <div class="stat"><b>315ms</b><span>per move</span></div>
      <div class="stat"><b>$0.0005</b><span>per move</span></div>
      <div class="stat"><b>90%</b><span>accuracy</span></div>
    </div>
  </div>
  <img class="logo" src="logo.png" alt="">
  <div class="play"></div>
</div>
</body></html>
